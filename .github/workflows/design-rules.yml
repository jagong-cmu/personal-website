name: Design rules

# The site is plain, white, and self-contained by design. These constraints are easy to
# erode one edit at a time, so they are checked on every push and pull request, along with
# the `api/` functions that generate the pages the rules then have to hold for.

on:
  push:
  pull_request:

jobs:
  design-rules:
    name: Check design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check design rules
        run: python3 .github/scripts/check-design-rules.py

      - name: Test design rules
        run: python3 .github/scripts/test-design-rules.py

      # The admin's own functions. Node is preinstalled on the runner and the tests use the
      # standard library only, so this needs no setup step and no `package.json`.
      - name: Test the api/ functions
        run: node .github/scripts/test-api.js
