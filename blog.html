<style>
:root {
  --ink: #111111;
  --grey: #6b6b6b;
  --link: #0645ad;
  --icon: #111111;
  --rule: #dcdcdc;
  --measure: 880px;
  --t-meta: 15px;
  --t-body: 17px;
  --t-lead: 19px;
}
* { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
  margin: 0;
  background: #FFFFFF;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--t-body);
  line-height: 1.6;
  font-weight: 400;
  overflow-wrap: break-word;
}
.page {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 96px 64px 160px;
}
a { color: var(--link); text-decoration: underline; }
a:hover { text-decoration: underline; }
p { margin: 0; }
ul { margin: 0; padding: 0 0 0 20px; }
li { margin: 0 0 8px; }
li:last-child { margin-bottom: 0; }

/* Header */
.masthead { display: flex; gap: 20px; align-items: flex-start; }
.masthead img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  flex: 0 0 auto;
}
.identity { min-width: 0; }
.name { font-size: var(--t-lead); font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
.oneline { margin: 0 0 12px; }
.links { display: flex; align-items: center; margin: -10px 0 -10px -12px; }
.links a {
  color: var(--icon);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  text-decoration: none;
}
.links a:hover { color: var(--link); }
.links svg { display: block; }

/* Tabs */
.tabs {
  margin: 40px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 24px;
}
.tabs a {
  color: var(--grey);
  text-decoration: none;
  padding: 2px 0;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current] {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* Content */
main { margin-top: 64px; }
html.js .panel { display: none; }
html.js .panel.is-active { display: block; }
.panel > * + * { margin-top: 56px; }

.entry > * + * { margin-top: 0; }
.entry-title { font-weight: 600; margin: 0; }
/* Company mark in a Work entry. Full colour on the owner's instruction of 2026-08-21
   (PRD section 9 exception, decision 41), enlarged to a 40px band on the owner's
   instruction of 2026-08-24 (decision 44). At 40px a mark no longer fits inside the
   title's 27.19px line box, so a Work entry is a two-column grid and the mark is a real
   left column aligned against the title-and-meta block rather than an inline image with a
   vertical-align nudge. No box, border, or background — the exception covers the mark only.
   The column is a fixed 40px, so all four company names share one left edge (decision 42).
   `object-fit: contain` keeps each mark's own aspect ratio inside it, left-aligned; nothing
   is stretched or cropped. Scoped to Work — the Projects panel shares .entry and
   .entry-title and must not gain a column. */
[data-panel="work"] .entry { display: grid; grid-template-columns: 40px 1fr; column-gap: 16px; }
[data-panel="work"] .entry > * { grid-column: 2; }
[data-panel="work"] .entry-logo { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
.entry-logo { width: 40px; height: 40px; object-fit: contain; object-position: left center; }
.entry-meta { color: var(--grey); font-size: var(--t-meta); margin: 2px 0 0; }
.entry-body { margin-top: 16px; }
.entry-links { font-size: var(--t-meta); margin-top: 12px; }
.note { color: var(--grey); }

/* A Projects entry is a rounded image card that shows the screenshot and nothing else at
   rest; the title, meta, and one-sentence description sit in an overlay revealed on hover
   (owner's instruction 2026-08-25, PRD section 9 exception, decisions 45 and 48-52).
   The card is the site's only border-as-styling and, with the headshot, one of only two
   elements permitted a non-zero border-radius — `check-design-rules.py` gates both by name.
   `overflow: hidden` is what makes the radius clip the screenshot, so no square image corner
   pokes out past it. Nothing else is granted: no shadow, no gradient, no tinted panel.
   One card per row at full measure, because at three across each image rendered about
   234x97 and was unreadable (decision 51).
   Motion stays at zero (decision 52). The reveal is an opacity switch with no transition and
   no transform; section 9's motion rule and CI's `transition` ban were not relaxed for it.
   The reveal must reach a visitor who cannot hover, so it is not hover-only: `:focus-within`
   opens it for a keyboard user, and anywhere the overlay is not offered the same text is laid
   out permanently under the image instead (decision 53). Its text is real markup at all times,
   only visually hidden by `opacity: 0`, so a screen reader reads all three descriptions with
   no interaction — do not "clean up" that markup as dead, and do not move it into CSS
   `content` or a script.
   Scoped to Projects throughout, the mirror of the Work grid's scoping: Work shares .entry
   and .entry-title and must not gain a border, exactly as Projects must not gain a logo
   column. A linked project's card is the click target: the title's <a> stretches an empty
   ::after over the whole card, which keeps the visible link on the title text (decision 29)
   rather than wrapping the prose in an anchor and flattening it to link colour. Chalk has no
   confirmed destination (decision 47) so it carries no anchor at all and nothing in its card
   implies a click; it takes `tabindex="0"` instead, which is the only way a keyboard user
   reaches a card with no focusable descendant. `.entry-links` is positioned so it paints
   above the stretched ::after and its Repository link stays independently clickable. */
[data-panel="projects"] .cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
[data-panel="projects"] .entry {
  position: relative;
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}
[data-panel="projects"] .entry-shot { display: block; width: 100%; height: auto; }
/* The permanent layout is the DEFAULT and the overlay is the enhancement, so a card only
   hides its text where the device has proved it can hover and the card is wide enough to
   hold the overlay. Everywhere else — every touch device at any width, and every hovering
   window below the floor — the title, meta, description, and any links row sit under the
   image, unscrimmed, with nothing to tap. */
[data-panel="projects"] .entry-reveal { padding: 20px; }
[data-panel="projects"] .entry-title a::after { content: ""; position: absolute; inset: 0; }
[data-panel="projects"] .entry-links { position: relative; }
/* The overlay is gated on hover and pointer capability rather than on viewport width
   (decision 53), because width alone answered the wrong question: an iPad at 768px reports
   a wide viewport and no hover, so under the old rule it showed three unlabelled
   screenshots and a tap left the site with nothing naming the destination.
   The `min-width` floor is measured, not guessed, and closes a second defect. The card's
   height is locked to the image's 12:5 ratio while the overlay's text grows as the card
   narrows, so `justify-content: flex-end` pushed the excess past the *top* edge, where
   `overflow: hidden` cut the title off. Title-top offsets against the card's top edge,
   negative meaning clipped away: 561px -53 / -85 / -49, 600px -36 / -69 / -9, 640px
   +8 / -28 / +35, 700px +33 / +24 / +60, 720px +41 / +32 / +68, 768px +88 / +52 / +88
   (ManuAI / PatientScope / Chalk). PatientScope's overlay is the tallest — longest
   description plus the Repository row — and only clears the overlay's own 28px top padding
   from 720px up, so the floor is 768px: the first round value above the measured one, and
   one that also keeps an iPad-width window on the permanent layout. Do not lower it without
   re-measuring PatientScope. */
@media (hover: hover) and (pointer: fine) and (min-width: 768px) {
  /* The scrim is flat white rather than a dark wash so the overlay keeps the site's own
     colour language — near-black text, grey meta, the link accent — over screenshots that
     range from ManuAI's dark camera feed to PatientScope's white dashboard. At 0.94 the
     composite is effectively white under every one of them, so the contrast the text gets
     does not depend on which image it happens to sit on. */
  [data-panel="projects"] .entry-reveal {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px;
    background: rgba(255, 255, 255, 0.94);
    opacity: 0;
  }
  [data-panel="projects"] .entry:hover .entry-reveal,
  [data-panel="projects"] .entry:focus-within .entry-reveal { opacity: 1; }
}

/* Journey */
.era { }
.era + .era { margin-top: 96px; }
.era-title { font-size: var(--t-lead); font-weight: 600; margin: 0 0 4px; line-height: 1.35; }
.era-range { color: var(--grey); font-size: var(--t-meta); margin: 0 0 40px; }
.jentry + .jentry { margin-top: 56px; }
.jentry.work { padding-left: 32px; }
.jlabel { color: var(--grey); font-size: var(--t-meta); margin: 0 0 4px; }
.jtitle { font-size: var(--t-body); font-weight: 600; margin: 0; line-height: 1.6; }
.jmeta { color: var(--grey); font-size: var(--t-meta); margin: 2px 0 0; }
.jtext { margin-top: 12px; }
.photos { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
.photo { flex: 0 0 auto; width: calc(50% - 6px); max-width: 100%; margin: 0; }
.photo img { display: block; width: 100%; max-width: 100%; height: auto; }
.photo figcaption { color: var(--grey); font-size: var(--t-meta); margin-top: 8px; }

@media (max-width: 560px) {
  .page { padding: 48px 20px 120px; }
  .masthead img { width: 104px; height: 104px; }
  .masthead { gap: 16px; }
  main { margin-top: 48px; }
  .tabs { gap: 8px 16px; font-size: var(--t-meta); }
  .jentry.work { padding-left: 16px; }
  .era + .era { margin-top: 72px; }
  .photo { width: 100%; }
}
</style>
